name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: python -m pip install --upgrade pip && pip install ".[test]"

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build && python -m build

      - name: Install built wheel in a clean env
        run: |
          python -m venv /tmp/ci_install_check
          /tmp/ci_install_check/bin/pip install --quiet dist/*.whl
          /tmp/ci_install_check/bin/python -c "import dsutils; print(dsutils.__version__)"
